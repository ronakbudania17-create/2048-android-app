name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Download game asset
        run: |
          mkdir -p app/src/main/assets
          curl -sL --fail "https://github.com/ronakbudania17-create/2048-android-app/releases/download/v1.0/game.html" -o app/src/main/assets/index.html
          echo "261a33a43af913135c532e6bf61d03c4c38ece1e82b554484919962b36303600  app/src/main/assets/index.html" | sha256sum -c -
          grep -q "CORE-LOGIC-START" app/src/main/assets/index.html
          echo "Game asset verified."

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2048-APK
          path: app/build/outputs/apk/release/app-release.apk
